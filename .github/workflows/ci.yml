name: CI
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: oms_test
          POSTGRES_USER: oms
          POSTGRES_PASSWORD: oms
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready -U oms -d oms_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: ruff check app tests
      - run: alembic upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://oms:oms@localhost:5432/oms_test
      - run: coverage run -m pytest
        env:
          DATABASE_URL: postgresql+psycopg://oms:oms@localhost:5432/oms_test
      - run: coverage report --fail-under=60
